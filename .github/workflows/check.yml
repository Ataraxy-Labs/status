name: check
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: data branch
        run: |
          git fetch origin data:data 2>/dev/null || true
          if git show-ref -q refs/heads/data; then git worktree add data data; else git worktree add --orphan -b data data; fi
      - run: python3 probe.py
      - name: save
        run: |
          cd data
          git config user.name "useland-status"
          git config user.email "status@users.noreply.github.com"
          git add -A
          git commit -qm "check $(date -u +%FT%TZ)"
          for i in 1 2 3; do git push -q origin data && break; git pull -q --rebase origin data; done
